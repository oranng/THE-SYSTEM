<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060a13"></head><body style="margin:0">
<title>СИСТЕМА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column "system window" app — sticky player header, stacked holographic panels, bottom tab bar. Deliberately dark-only. */
:root{
  --void:#060a13; --panel:#0b1322; --panel2:#101b30; --line:rgba(120,175,255,.22); --line-hi:rgba(140,195,255,.55);
  --ice:#86c8ff; --ice-deep:#3c8dde; --text:#dce7fb; --dim:#7d90b2;
  --gold:#e9c46a; --red:#ff6f7d; --green:#6fe0ae; --violet:#b48cff;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--text);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60rem 30rem at 50% -10rem,rgba(60,141,222,.18),transparent 70%),
  repeating-linear-gradient(0deg,rgba(134,200,255,.025) 0 1px,transparent 1px 4px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--void);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px 110px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}

/* header */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px;padding:12px 16px 10px;
  background:linear-gradient(var(--void) 70%,rgba(6,10,19,.85));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hud-row{display:flex;align-items:center;gap:12px}
.rank-badge{flex:none;width:46px;height:46px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;
  border:1px solid var(--line-hi);background:var(--panel);color:var(--ice);clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%);
  text-shadow:0 0 12px rgba(134,200,255,.6)}
.who{min-width:0;flex:1}
.who .name{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .title{font-size:12px;color:var(--violet);letter-spacing:.04em}
.lvl{text-align:right;flex:none}
.lvl b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--ice)}
.lvl small{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em}
.xpbar{margin-top:8px;height:6px;background:rgba(134,200,255,.1);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ice-deep),var(--ice));box-shadow:0 0 10px var(--ice);transition:width .5s}
.hud-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--dim)}
.gold{color:var(--gold)}

/* panels */
.stack{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.win{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:16px;border-radius:2px}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--ice);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--ice);text-transform:uppercase}
.win h2{font-size:18px}
.lead{color:var(--dim);font-size:13px;margin:4px 0 0}

/* quest rows */
.q{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.chk{flex:none;width:26px;height:26px;border:1.5px solid var(--line-hi);border-radius:3px;display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk svg{width:16px;height:16px;opacity:0;stroke:var(--void);stroke-width:3;fill:none}
.q.done .chk{background:var(--ice);border-color:var(--ice);box-shadow:0 0 12px rgba(134,200,255,.5)}
.q.done .chk svg{opacity:1}
.q-body{flex:1;min-width:0}
.q-t{font-weight:500}
.q.done .q-t{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(134,200,255,.4)}
.q-hint{font-size:12.5px;color:var(--dim);margin-top:2px}
.q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--dim);white-space:nowrap}
.chip.r-E{color:#9fb0c8}.chip.r-D{color:var(--green)}.chip.r-C{color:var(--ice)}.chip.r-B{color:var(--violet)}.chip.r-A{color:var(--gold)}.chip.r-S{color:var(--red)}
.chip.xp{color:var(--ice)} .chip.g{color:var(--gold)}
.mini{font-size:12px;color:var(--dim);padding:4px 8px;border:1px solid var(--line);border-radius:2px}
.mini:hover{color:var(--text);border-color:var(--line-hi)}
.q.pen{background:rgba(255,111,125,.06);margin:0 -16px;padding:12px 16px;border-top:1px solid rgba(255,111,125,.35)}
.q.pen .chk{border-color:var(--red)}
.q.pen.done .chk{background:var(--red);border-color:var(--red)}

/* mandatory */
.mand{border-color:var(--line-hi);box-shadow:0 0 0 1px rgba(134,200,255,.06),0 0 40px -10px rgba(60,141,222,.35)}
.mand-goal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:2px;text-align:left}
.mg .chk{width:22px;height:22px}
.mg.done{border-color:var(--ice);background:rgba(134,200,255,.07)}
.mg.done .chk{background:var(--ice);border-color:var(--ice)}.mg.done .chk svg{opacity:1}
.mg span{font-size:13px;line-height:1.3}
.warn{color:var(--red);font-size:13px;margin-top:10px}
.ok{color:var(--green);font-size:13px;margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.st{display:flex;flex-direction:column;gap:4px}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.st-top span{font-size:13px}
.st-top b{font-family:var(--f-mono);font-size:15px;color:var(--ice)}
.st-bar{height:3px;background:rgba(134,200,255,.1)}
.st-bar i{display:block;height:100%;background:var(--ice)}
.plus{width:24px;height:24px;border:1px solid var(--gold);color:var(--gold);border-radius:2px;font-family:var(--f-mono);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--text)}
.kpi span{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.quote{font-size:14px;font-style:italic;color:var(--text);border-left:2px solid var(--ice);padding-left:12px;margin:0}

/* paths */
.path{border-top:1px solid var(--line);padding:14px 0}
.path:first-of-type{border-top:0;padding-top:0}
.path-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.path-h h3{font-size:15px}
.steps{display:flex;gap:3px;margin:8px 0}
.steps i{flex:1;height:4px;background:rgba(134,200,255,.12)}
.steps i.on{background:var(--ice)}
.cur{font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--ice);color:var(--ice);
  font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;background:rgba(134,200,255,.06)}
.btn:hover{background:rgba(134,200,255,.14)}
.btn.solid{background:var(--ice);color:var(--void)}
.btn.danger{border-color:var(--red);color:var(--red);background:rgba(255,111,125,.06)}
.btn.goldb{border-color:var(--gold);color:var(--gold);background:rgba(233,196,106,.06)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.form{display:grid;gap:8px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* rewards */
.rw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .t{flex:1;min-width:0}
.x{color:var(--dim);font-size:18px;padding:4px 8px}

/* journal */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:2px;background:rgba(134,200,255,.06);border:1px solid transparent;max-width:100%}
.heat i.l1{background:rgba(134,200,255,.22)}.heat i.l2{background:rgba(134,200,255,.45)}.heat i.l3{background:var(--ice);box-shadow:0 0 8px rgba(134,200,255,.5)}
.heat i.miss{border-color:rgba(255,111,125,.5)}
.heat i.today{outline:1px solid var(--gold);outline-offset:1px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.log li:first-child{border-top:0}
.log time{font-family:var(--f-mono);font-size:11px;color:var(--dim);flex:none;padding-top:2px}
.titles{display:flex;flex-wrap:wrap;gap:8px}
.ttl{padding:6px 10px;border:1px solid var(--line);border-radius:2px;font-size:13px}
.ttl.on{border-color:var(--violet);color:var(--violet)}
.ttl.lock{opacity:.35}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(8,13,24,.96);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--dim);letter-spacing:.02em}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button.on{color:var(--ice)}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(134,200,255,.7))}
.dot{position:relative}
.dot::after{content:"";position:absolute;top:2px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--red)}

/* system message */
.sys{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;background:rgba(3,6,12,.72);backdrop-filter:blur(3px)}
.sys .win{width:100%;max-width:420px;text-align:center;padding:26px 20px;animation:pop .35s ease-out}
.sys .tag{display:block;margin-bottom:12px}
.sys h2{font-size:22px;color:var(--ice);text-shadow:0 0 18px rgba(134,200,255,.5);margin-bottom:10px}
.sys p{margin:0 0 18px;color:var(--text)}
.sys.bad h2{color:var(--red);text-shadow:0 0 18px rgba(255,111,125,.5)}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;
  background:var(--panel2);border:1px solid var(--line-hi);padding:8px 14px;font-size:13px;border-radius:2px;max-width:calc(100% - 32px);transition:opacity .3s}
.toast b{color:var(--ice);font-family:var(--f-mono);font-weight:500}

/* onboarding */
.awake{min-height:100%;display:grid;place-items:center;padding-block:40px}
.awake .win{max-width:440px;width:100%}
.awake h1{font-size:30px;color:var(--ice);text-shadow:0 0 22px rgba(134,200,255,.45);margin:6px 0 12px}
.awake p{color:var(--dim);margin:0 0 14px}
.awake ul{margin:0 0 18px;padding-left:18px;color:var(--text);font-size:14px}
textarea{min-height:90px;font-family:var(--f-mono);font-size:11px}
@media (max-width:380px){.mand-goal{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden><div class="nav-in" id="navIn"></div></nav>
<div id="layer"></div>

<script>
(function(){

// [название, ранг, подсказка]
const POOLS={
 mind:{stat:"int",items:[

 ]},

  ["Сделай одно действие по поиску клиентов или работы","C","Отклик, письмо, сообщение. Деньги приходят через людей."],
  ["Прочитай статью о личных финансах или инвестициях","E","Сложный процент работает и для знаний."],
  ["Добавь в резюме или портфолио один результат с цифрами","C","«Увеличил продажи на 15%» сильнее, чем «отвечал за продажи»."],
  ["Посчитай свой доход в час и придумай, как поднять его на 20%","C","Сколько стоит час твоего времени сейчас?"],

  ["2 часа без телефона: он лежит в другой комнате","B","Почувствуй, сколько времени у тебя на самом деле."],
  ["Вечерний дневник: что сделал, что улучшить завтра","D","Три строки — уже достаточно."]
 ]},
 social:{stat:"cha",items:[
  ["Заговори с незнакомым человеком","C","Продавец, сосед, коллега. Просто начни."],
  ["Позвони родным или другу, с которым давно не говорил","D","Связи держатся на внимании."],
  ["Сделай кому-то искренний конкретный комплимент","E","Конкретный: не «ты классный», а за что именно."],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dk=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDk=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12);};
const addDays=(k,n)=>{const d=fromDk(k);d.setDate(d.getDate()+n);return dk(d);};
const daysBetween=(a,b)=>Math.round((fromDk(b)-fromDk(a))/864e5);
function weekKey(k){const d=fromDk(k);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dk(d);}
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function save(){
  if(!state) return;
  state.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(pushCloud,700);
}
function pushCloud(){
  if(!cloud.ref||!state) return;
  const payload={s:JSON.stringify(state),t:state.updatedAt||Date.now()};
  chain=chain.then(()=>cloud.ref.set(payload)).then(()=>{cloud.ok=true;},()=>{cloud.ok=false;});
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    cloud.tried=true;
    if(!db||!user) return;
    const id=await user.id();
    if(!id) return;
    cloud.ref=db.doc("data/users/"+id+"/save");
    const snap=await cloud.ref.get();
    const d=snap.exists?snap.data():null;
    if(d&&typeof d.s==="string"&&(!state||(d.t||0)>(state.updatedAt||0))){
      state=JSON.parse(d.s);
      try{localStorage.setItem(LS,d.s);}catch(e){}
      boot();
    }else if(state){pushCloud();}
    cloud.ok=true;
    if(view==="settings") render();
  }catch(e){}
}

const queue=[];
function notify(tag,title,text,bad){queue.push({tag,title,text,bad});}
function log(text){state.log.unshift({d:dk(),text});state.log=state.log.slice(0,60);}

function gainXp(n){
  state.xp+=n;state.totalXp=Math.max(0,state.totalXp+n);
  while(state.xp>=req(state.level)){
    const before=rankOf(state.level);
    state.xp-=req(state.level);state.level++;state.free+=3;
    const after=rankOf(state.level);
    if(after!==before){notify("ПОВЫШЕНИЕ РАНГА",`Ранг ${after}`,`Вы стали охотником ранга ${after}. Квесты станут тяжелее, награды — больше.`);log(`Получен ранг ${after}`);}
    else notify("УРОВЕНЬ ПОВЫШЕН",`Уровень ${state.level}`,"Получено 3 очка характеристик. Распределите их на экране статуса.");
    log(`Достигнут уровень ${state.level}`);
  }
  while(state.xp<0){
    if(state.level>1){state.level--;state.xp+=req(state.level);state.free=Math.max(0,state.free-3);}
    else{state.xp=0;break;}
  }
}
function applyQuest(q,sign){
  gainXp(sign*q.xp);state.gold=Math.max(0,state.gold+sign*q.gold);
  if(q.stat) state.stats[q.stat]=Math.max(1,state.stats[q.stat]+sign*(q.rank==="A"||q.rank==="S"||q.rank==="B"?2:1));
  state.questsDone=Math.max(0,state.questsDone+sign);
}
function mandTargets(l){
  const n=Math.min(100,20+2*(l-1));
  return [["push",`Отжимания — ${n}`],["squat",`Приседания — ${n}`],["abs",`Пресс — ${n}`],["run",`Бег или быстрая ходьба — ${Math.min(10,2+Math.floor((l-1)/6))} км`]];
}
function makeQuest(cat,item,kind){
  const [t,r,h]=item;const xp=QXP[r];
  return {id:uid(),kind:kind||"daily",cat,t,h,rank:r,stat:POOLS[cat]?POOLS[cat].stat:null,xp,gold:Math.round(xp/3),done:false};
}
function genDay(key){
  const R=rng(hash(key+"|"+state.name));
  const pick=cat=>{const it=POOLS[cat].items;return makeQuest(cat,it[Math.floor(R()*it.length)]);};
  const q=[pick("mind"),pick("money"),pick("will"),pick(R()<.5?"social":"body")];
  if(state.level>=20) q.push(pick(R()<.5?"money":"mind"));
  for(const c of state.custom) q.push({id:uid(),kind:"custom",cat:"custom",t:c.t,h:"Твой собственный ежедневный квест.",rank:c.r,stat:c.s,xp:QXP[c.r],gold:Math.round(QXP[c.r]/3),done:false});
  return {q,m:{},mDone:false,lvl:state.level,pen:null,rr:0};
}
function ensureToday(){
  const today=dk();
  if(state.days[today]){return;}
  if(state.lastDay&&state.lastDay<today){
    const last=state.days[state.lastDay];
    const gap=daysBetween(state.lastDay,today);
    let missed=0;
    if(last&&!last.mDone) missed++;
    missed+=Math.max(0,gap-1);
    const penUndone=last&&last.pen&&!last.pen.done;
    if(missed>0||penUndone){
      const loss=Math.min(3,missed)*30+(penUndone?40:0);
      const hadStreak=state.streak;
      state.streak=0;state.xp=Math.max(0,state.xp-loss);state.totalXp=Math.max(0,state.totalXp-loss);
      notify("ШТРАФНАЯ ЗОНА","Обязательный квест провален",
        `${missed?`Пропущено дней: ${missed}. `:""}${penUndone?"Штрафной квест не выполнен. ":""}Потеряно ${loss} XP.${hadStreak?` Серия ${hadStreak} дн. сброшена.`:""} Сегодня добавлен штрафной квест.`,true);
      log(`Штраф: −${loss} XP`);
    }
    state.days[today]=genDay(today);
    if(missed>0||penUndone){
      const t=PENALTIES[hash(today)%PENALTIES.length];
      state.days[today].pen={t,done:false,xp:20};
    }
  }else{
    state.days[today]=genDay(today);
  }
  state.lastDay=today;
  // keep 150 days of history
  const keys=Object.keys(state.days).sort();
  while(keys.length>150) delete state.days[keys.shift()];
  // weekly boss
  const wk=weekKey(today);
  if(state.boss.week!==wk){state.boss={week:wk,done:false};}
  save();
}
const bossOf=wk=>BOSSES[hash(wk+"boss")%BOSSES.length];

function toggleQuest(id){
  const d=today();const q=d.q.find(x=>x.id===id);if(!q) return;
  q.done=!q.done;applyQuest(q,q.done?1:-1);

}
function toggleMand(k){
  const d=today();d.m[k]=!d.m[k];
  gainXp(d.m[k]?10:-10);
  const all=mandTargets(d.lvl).every(([key])=>d.m[key]);
  if(all&&!d.mDone){
    d.mDone=true;gainXp(40);state.gold+=20;state.stats.str++;state.stats.vit++;
    state.streak++;state.best=Math.max(state.best,state.streak);
    notify("КВЕСТ ВЫПОЛНЕН","Подготовка к становлению сильнее",`Награда: +80 XP, +20 ◈, СИЛ +1, ВЫН +1. Серия: ${state.streak} дн. Штрафа не будет.`);
    log(`Обязательный квест выполнен · серия ${state.streak}`);
  }else if(!all&&d.mDone){
    d.mDone=false;gainXp(-40);state.gold=Math.max(0,state.gold-20);state.stats.str--;state.stats.vit--;
    state.streak=Math.max(0,state.streak-1);
  }else if(d.m[k]) toast("<b>+10 XP</b>");
  save();render();flush();
}
function togglePen(){
  const d=today();if(!d.pen) return;d.pen.done=!d.pen.done;gainXp(d.pen.done?d.pen.xp:-d.pen.xp);
  if(d.pen.done){notify("ШТРАФ СНЯТ","Вы покинули штрафную зону","Система принимает ваше искупление. Не повторяйте ошибку.");log("Штрафной квест выполнен");}

}
function reroll(id){
  const d=today();if(d.rr>=2) return;
  const i=d.q.findIndex(x=>x.id===id);const q=d.q[i];if(!q||q.done||!POOLS[q.cat]) return;
  const used=new Set(d.q.map(x=>x.t));
  const opts=POOLS[q.cat].items.filter(it=>!used.has(it[0]));
  if(!opts.length) return;
  d.q[i]=makeQuest(q.cat,opts[Math.floor(Math.random()*opts.length)]);d.rr++;
  save();render();
}
function completeStep(k){
  const p=PATHS.find(x=>x.k===k);const i=state.paths[k];if(i>=p.steps.length) return;
  const xp=100+50*i,gold=40+20*i;
  state.paths[k]++;gainXp(xp);state.gold+=gold;state.stats[p.stat]+=3;
  const fin=state.paths[k]>=p.steps.length;
  notify(fin?"ПУТЬ ПРОЙДЕН":"СЮЖЕТНЫЙ КВЕСТ",fin?p.name:`${p.name}: этап ${i+1}`,`«${p.steps[i][0]}» — выполнено. +${xp} XP, +${gold} ◈, ${STATS[p.stat][1]} +3.`);
  log(`${p.name}: этап ${i+1} пройден`);
  save();render();flush();
}
function undoStep(k){
  const p=PATHS.find(x=>x.k===k);const i=state.paths[k]-1;if(i<0) return;
  state.paths[k]=i;gainXp(-(100+50*i));state.gold=Math.max(0,state.gold-(40+20*i));state.stats[p.stat]=Math.max(1,state.stats[p.stat]-3);
  save();render();
}
function killBoss(){
  if(state.boss.done) return;
  const b=bossOf(state.boss.week);
  state.boss.done=true;state.bosses++;gainXp(300);state.gold+=120;state.stats[b[1]]+=3;
  notify("БОСС ПОВЕРЖЕН",b[0].split(":")[0],`+300 XP, +120 ◈, ${STATS[b[1]][1]} +3. Новый босс появится в понедельник.`);
  log(`Повержен босс: ${b[0].split(":")[0]}`);
  save();render();flush();
}
function buy(id){
  const r=state.rewards.find(x=>x.id===id);if(!r||state.gold<r.c) return;
  state.gold-=r.c;state.bought++;log(`Награда получена: ${r.t} (−${r.c} ◈)`);
  notify("НАГРАДА","Вы заслужили это",`«${r.t}». Наслаждайтесь без чувства вины — это оплачено дисциплиной.`);
  save();render();flush();
}

let toastT=null;
function toast(html){
  let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.innerHTML=html;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{el.style.opacity=0;},1800);
}
function flush(){
  if($("#layer").firstChild||!queue.length) return;
  const n=queue.shift();
  $("#layer").innerHTML=`<div class="sys ${n.bad?"bad":""}" role="dialog" aria-modal="true"><div class="win"><span class="tag">[ ${esc(n.tag)} ]</span><h2>${esc(n.title)}</h2><p>${esc(n.text)}</p><button class="btn solid" data-act="closeSys">Понятно</button></div></div>`;
  const b=$("#layer .btn");if(b) b.focus();
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el) return;
  const a=el.dataset.act,id=el.dataset.id,k=el.dataset.k;
  switch(a){
    case "view":view=k;confirmReset=false;render();window.scrollTo(0,0);break;
    case "q":toggleQuest(id);break;
    case "m":toggleMand(k);break;
    case "pen":togglePen();break;
    case "reroll":reroll(id);break;
    case "step":completeStep(k);break;
    case "undoStep":undoStep(k);break;
    case "boss":killBoss();break;
    case "buy":buy(id);break;
    case "alloc":if(state.free>0){state.free--;state.stats[k]++;save();render();}break;
    case "delReward":state.rewards=state.rewards.filter(r=>r.id!==id);save();render();break;
    case "delCustom":state.custom=state.custom.filter(c=>c.id!==id);save();render();break;
    case "title":state.title=el.dataset.n;save();render();break;
    case "closeSys":$("#layer").innerHTML="";flush();break;
    case "copy":{const ta=$("#bk");const txt=ta.value;
      const fb=()=>{ta.focus();ta.select();toast("Выделено — скопируйте вручную");};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Скопировано"),fb);}catch(err){fb();}break;}
    case "import":{try{const s=JSON.parse($("#bk").value);if(!s||!s.stats||!s.days) throw 0;state=s;save();ensureToday();toast("Прогресс загружен");render();}catch(err){toast("Код не подходит. Проверьте, что скопирован полностью.");}break;}
    case "reset":if(!confirmReset){confirmReset=true;render();}else{state=null;confirmReset=false;try{localStorage.removeItem(LS);}catch(err){}if(cloud.ref) chain=chain.then(()=>cloud.ref.delete()).catch(()=>{});view="status";render();}break;
    case "cancelReset":confirmReset=false;render();break;
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="awakeForm"){const n=$("#nm").value.trim();if(!n) return;state=newState(n);log("Игрок пробудился");ensureToday();
    notify("СИСТЕМА","Добро пожаловать, Игрок",`${n}, ваш путь начинается с ранга E. Выполните обязательный квест сегодня, иначе попадёте в штрафную зону.`);view="quests";render();flush();}
  if(f.id==="customForm"){const t=$("#cT").value.trim();if(!t) return;const c={id:uid(),t,s:$("#cS").value,r:$("#cR").value};state.custom.push(c);
    today().q.push({id:uid(),kind:"custom",cat:"custom",t:c.t,h:"Твой собственный ежедневный квест.",rank:c.r,stat:c.s,xp:QXP[c.r],gold:Math.round(QXP[c.r]/3),done:false});save();render();toast("Квест добавлен");}
  if(f.id==="rewardForm"){const t=$("#rT").value.trim(),c=parseInt($("#rC").value,10);if(!t||!(c>0)) return;state.rewards.push({id:uid(),t,c});save();render();}
  if(f.id==="nameForm"){const n=$("#nm2").value.trim();if(n){state.name=n;save();render();toast("Имя сохранено");}}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state&&!state.days[dk()]){ensureToday();render();flush();}});
setInterval(()=>{if(state&&!state.days[dk()]){ensureToday();render();flush();}},60000);

function boot(){if(state){ensureToday();}render();flush();}
boot();
initCloud();
})();
</script>
